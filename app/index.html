<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1b1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lobsterclaw" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/lobster.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    
    <!-- Meta -->
    <title>Lobsterclaw Dashboard</title>
    <meta name="description" content="Panel de control para OpenClaw" />
    <script>
    document.write('<div id="btag" style="position:fixed;top:4px;right:4px;font-size:13px;color:#ccc;z-index:99999;font-family:monospace;background:#000;padding:2px 6px;border-radius:4px">b:0226-1205</div>');
    window.onerror=function(m,s,l,c){
      var d=document.getElementById('btag');if(!d)return;
      d.style.color='#ff6b6b';d.style.maxWidth='95vw';d.style.wordBreak='break-all';d.style.whiteSpace='normal';d.style.top='40px';
      d.textContent='ERR:'+m+'|'+(s||'').split('/').pop()+':'+l+':'+c;
    };
    window.addEventListener('unhandledrejection',function(e){
      var d=document.getElementById('btag');if(!d)return;
      d.style.color='#ff6b6b';d.style.maxWidth='95vw';d.style.wordBreak='break-all';d.style.whiteSpace='normal';d.style.top='40px';
      d.textContent='REJ:'+(e.reason&&e.reason.message||e.reason||'?');
    });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
